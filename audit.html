<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF9F5">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nomade Audit</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = { databaseURL: "https://nomademadeira-waiter-default-rtdb.europe-west1.firebasedatabase.app/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Nomade light colour identity — replaces the dark charcoal/turquoise/gold theme. */
  --nomade-bg: #FFFFFF;
  --nomade-surface: #FAF9F5;
  --nomade-surface-raised: #FFFFFF;
  --nomade-text: #171717;
  --nomade-muted: #66625E;
  --nomade-olive: #789818;
  --nomade-olive-bright: #8FA91C;
  --nomade-olive-soft: #EEF3D9;
  --nomade-orange: #E85020;
  --nomade-orange-soft: #FCE8DF;
  --nomade-red: #A01818;
  --nomade-red-soft: #F7E2E2;
  --nomade-border: #D8D3C8;
  --nomade-shadow: rgba(25, 25, 20, 0.10);
  --nomade-olive-rgb: 120, 152, 24;
  --nomade-orange-rgb: 232, 80, 32;
  --nomade-red-rgb: 160, 24, 24;
  color-scheme: light;
}
/* Contrast note (measured, WCAG 2.1): olive/orange TEXT on white or on their own pale
   tint fails small-text AA (~2.6-3.3:1) even at low background opacity — verified
   programmatically, not assumed. Action badges below therefore use a pale tint
   background + full-colour border for hue-coding, with BLACK badge text (olive/orange
   categories) since black passes safely against any of these light backgrounds;
   red-category badges keep red text, since red-on-its-own-pale-tint measures 6.4:1
   (still comfortably AA) unlike olive/orange. */
body { background: var(--nomade-bg); color: var(--nomade-text); font-family: 'DM Mono', monospace, 'Courier New', monospace; font-size: 12px; min-height: 100vh; }
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Mono:wght@400;500&display=swap');

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--nomade-surface);
  border-bottom: 1px solid var(--nomade-border); flex-shrink: 0;
  gap: 12px; flex-wrap: wrap;
}
.topbar-logo {
  font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700;
  color: var(--nomade-olive); letter-spacing: 2px; white-space: nowrap; flex-shrink: 0;
}
.topbar-logo span { color: var(--nomade-orange); }
.topbar-sub { font-size: 10px; color: var(--nomade-muted); letter-spacing: 1.5px; text-transform: uppercase; }

.controls {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px;
  background: var(--nomade-bg); border-bottom: 1px solid var(--nomade-border);
}
.controls input {
  background: var(--nomade-bg); border: 1px solid var(--nomade-border); border-radius: 4px;
  color: var(--nomade-text); font-family: inherit; font-size: 11px; padding: 5px 9px;
  outline: none; min-width: 120px; flex: 1;
}
.controls input:focus { border-color: var(--nomade-olive); }
.controls input::placeholder { color: var(--nomade-muted); opacity: 0.75; }
.btn-clear-filters {
  background: var(--nomade-bg); border: 1px solid var(--nomade-border); border-radius: 4px;
  color: var(--nomade-muted); font-family: inherit; font-size: 11px; padding: 5px 12px;
  cursor: pointer; letter-spacing: 0.5px; flex-shrink: 0;
}
.btn-clear-filters:hover { border-color: var(--nomade-olive); color: var(--nomade-text); }
.btn-test-write {
  background: var(--nomade-bg); border: 1px solid var(--nomade-border); border-radius: 4px;
  color: var(--nomade-muted); font-family: inherit; font-size: 11px; padding: 5px 12px;
  cursor: pointer; letter-spacing: 0.5px; flex-shrink: 0;
}
.btn-test-write:hover { border-color: var(--nomade-olive); color: var(--nomade-text); }
.btn-test-write:disabled { opacity: 0.5; cursor: default; }

.event-list { padding: 6px 8px; }
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--nomade-muted);
  font-size: 11px; letter-spacing: 1px;
}

.error-block {
  background: var(--nomade-red-soft); border: 1px solid var(--nomade-red);
  border-radius: 6px; margin: 20px 12px; padding: 16px 18px;
}
.error-title  { color: var(--nomade-red); font-size: 13px; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
.error-detail { color: var(--nomade-text); font-size: 11px; margin-bottom: 4px; }
.error-hint   { color: var(--nomade-text); font-weight: 700; font-size: 10px; margin-top: 10px; letter-spacing: 0.3px; line-height: 1.5; }

.event-row {
  border: 1px solid var(--nomade-border); border-radius: 5px;
  margin-bottom: 4px; cursor: pointer; overflow: hidden;
  transition: border-color 0.15s; background: var(--nomade-surface-raised);
}
.event-row:hover { border-color: var(--nomade-olive); }
.event-main {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  padding: 6px 10px; background: var(--nomade-surface-raised);
}
.event-time  { font-size: 10px; color: var(--nomade-muted); flex-shrink: 0; white-space: nowrap; }
.event-device { font-size: 11px; color: var(--nomade-text); font-weight: 700; flex-shrink: 0; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event-id    { font-size: 9px; color: var(--nomade-muted); flex-shrink: 0; white-space: nowrap; }
.event-table { background: var(--nomade-orange-soft); color: var(--nomade-text); font-weight: 700; font-size: 9px; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; letter-spacing: 0.5px; }
.event-summary { font-size: 11px; color: var(--nomade-text); flex: 1; min-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.event-action {
  font-size: 9px; letter-spacing: 0.8px; padding: 2px 6px; border-radius: 3px;
  flex-shrink: 0; text-transform: uppercase; font-weight: 700;
}
.action-order_add         { background: rgba(var(--nomade-olive-rgb),0.14); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }
.action-order_qty_change  { background: rgba(var(--nomade-olive-rgb),0.08); color: var(--nomade-muted); border: 1px solid var(--nomade-border); }
.action-order_clear       { background: var(--nomade-red-soft); color: var(--nomade-red); border: 1px solid var(--nomade-red); }
.action-table_checkout    { background: rgba(var(--nomade-orange-rgb),0.18); color: var(--nomade-text); border: 1px solid var(--nomade-orange); }
.action-send_to_keeper    { background: rgba(var(--nomade-orange-rgb),0.14); color: var(--nomade-text); border: 1px solid var(--nomade-orange); }
.action-app_open          { background: rgba(var(--nomade-olive-rgb),0.12); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }
.action-device_created    { background: rgba(var(--nomade-olive-rgb),0.12); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }
.action-device_named      { background: rgba(var(--nomade-olive-rgb),0.10); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }
.action-device_rename     { background: rgba(var(--nomade-olive-rgb),0.08); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }
.action-menu_item_create  { background: rgba(var(--nomade-olive-rgb),0.12); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }
.action-menu_item_update  { background: rgba(var(--nomade-olive-rgb),0.08); color: var(--nomade-muted); border: 1px solid var(--nomade-border); }
.action-menu_item_disable { background: var(--nomade-red-soft); color: var(--nomade-red); border: 1px solid var(--nomade-red); }
.action-menu_item_reactivate      { background: rgba(var(--nomade-olive-rgb),0.12); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }
.action-menu_item_variants_update { background: rgba(var(--nomade-olive-rgb),0.08); color: var(--nomade-muted); border: 1px solid var(--nomade-border); }
.action-MENU_SEEDED       { background: rgba(var(--nomade-olive-rgb),0.20); color: var(--nomade-text); font-weight: 700; border: 1px solid var(--nomade-olive); }
.action-MENU_MIGRATED     { background: rgba(var(--nomade-olive-rgb),0.20); color: var(--nomade-text); font-weight: 700; border: 1px solid var(--nomade-olive); }
.action-wine_create       { background: rgba(var(--nomade-orange-rgb),0.10); color: var(--nomade-text); border: 1px solid var(--nomade-orange); }
.action-wine_update       { background: rgba(var(--nomade-orange-rgb),0.08); color: var(--nomade-text); border: 1px solid var(--nomade-orange); }
.action-wine_disable      { background: var(--nomade-red-soft); color: var(--nomade-red); border: 1px solid var(--nomade-red); }
.action-wine_reactivate   { background: rgba(var(--nomade-orange-rgb),0.10); color: var(--nomade-text); border: 1px solid var(--nomade-orange); }
.action-stoplist_change   { background: var(--nomade-red-soft); color: var(--nomade-red); border: 1px solid var(--nomade-red); }
.action-stoplist_clear    { background: var(--nomade-red-soft); color: var(--nomade-red); font-weight: 700; border: 1px solid var(--nomade-red); }
.action-notes_update      { background: rgba(var(--nomade-olive-rgb),0.08); color: var(--nomade-muted); border: 1px solid var(--nomade-border); }
.action-audit_test        { background: rgba(var(--nomade-olive-rgb),0.10); color: var(--nomade-text); border: 1px solid var(--nomade-olive); }

.event-detail {
  background: var(--nomade-surface); border-top: 1px solid var(--nomade-border);
  padding: 8px 12px;
}
.event-detail pre {
  font-size: 10px; color: var(--nomade-text); white-space: pre-wrap; word-break: break-word;
  line-height: 1.5;
}

.status-bar {
  padding: 6px 12px; font-size: 10px; color: var(--nomade-muted);
  letter-spacing: 0.5px; border-top: 1px solid var(--nomade-border);
  position: sticky; bottom: 0; background: var(--nomade-surface);
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-logo">NOMADE</div>
    <div class="topbar-sub">Audit Log</div>
  </div>
  <div id="statusText" style="font-size:10px;color:var(--nomade-muted);letter-spacing:0.5px">Loading audit log...</div>
</div>

<div class="controls">
  <input id="filterDevice"  placeholder="Filter: device name" />
  <input id="filterAction"  placeholder="Filter: action" />
  <input id="filterTable"   placeholder="Filter: table" />
  <input id="filterSearch"  placeholder="Search all fields..." />
  <button class="btn-clear-filters" onclick="clearFilters()">✕ Clear</button>
  <button class="btn-test-write" id="testWriteBtn" onclick="writeTestEvent()">Write test event</button>
  <div id="testWriteNotice" style="display:none;background:rgba(var(--nomade-red-rgb),0.10);border:1px solid rgba(var(--nomade-red-rgb),0.3);border-radius:4px;padding:6px 10px;font-size:10px;color:var(--nomade-red);letter-spacing:0.3px;flex-basis:100%"></div>
</div>

<div class="event-list" id="eventList"></div>
<div class="status-bar" id="statusBar"></div>

<script>
let allEvents = [];

const ACTION_LABELS = {
  app_open:                  { ru: 'Вход',                        en: 'App open' },
  device_created:            { ru: 'Новое устройство',            en: 'New device' },
  device_named:              { ru: 'Устройство названо',          en: 'Device named' },
  device_rename:             { ru: 'Переименование устройства',   en: 'Device renamed' },
  order_add:                 { ru: 'Добавлено',                   en: 'Item added' },
  order_qty_change:          { ru: 'Изм. количество',             en: 'Qty changed' },
  order_clear:               { ru: 'Расчёт / очистка',           en: 'Order cleared' },
  table_checkout:            { ru: 'РАСЧЁТ',                      en: 'CHECKOUT' },
  send_to_keeper:            { ru: 'Отправлено в KEEPER',         en: 'Sent to KEEPER' },
  menu_item_create:          { ru: 'Пункт меню создан',           en: 'Menu item created' },
  menu_item_update:          { ru: 'Пункт меню обновлён',         en: 'Menu item updated' },
  menu_item_disable:         { ru: 'Пункт меню отключён',         en: 'Menu item disabled' },
  menu_item_reactivate:      { ru: 'Пункт меню активирован',      en: 'Menu item reactivated' },
  menu_item_variants_update: { ru: 'Варианты обновлены',          en: 'Variants updated' },
  wine_create:               { ru: 'Вино добавлено',              en: 'Wine created' },
  wine_update:               { ru: 'Вино обновлено',              en: 'Wine updated' },
  wine_disable:              { ru: 'Вино отключено',              en: 'Wine disabled' },
  wine_reactivate:           { ru: 'Вино активировано',           en: 'Wine reactivated' },
  stoplist_change:           { ru: 'Стоп-лист изменён',           en: 'Stop list changed' },
  stoplist_clear:            { ru: 'Стоп-лист очищен',            en: 'Stop list cleared' },
  notes_update:              { ru: 'Заметки обновлены',           en: 'Notes updated' },
  audit_test:                { ru: 'Тест записи',                  en: 'Test event' },
  MENU_SEEDED:               { ru: 'Меню загружено',              en: 'Menu seeded' },
  MENU_MIGRATED:             { ru: 'Меню обновлено (v2)',         en: 'Menu migrated (v2)' },
};

function getActionLabel(action) {
  const labels = ACTION_LABELS[action];
  return labels ? (labels.en || action) : action;
}

function formatTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit' }) +
    ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function getPayloadSummary(action, payload) {
  if (!payload) return '';
  try {
    switch (action) {
      case 'order_add':
        return 'T' + payload.table + ': ' + (payload.itemName || '') + ' ×1';
      case 'order_qty_change':
        return 'T' + payload.table + ': ' + (payload.itemName || '') + ' ' +
          (payload.delta > 0 ? '+' : '') + payload.delta +
          ' (' + payload.beforeQty + '→' + payload.afterQty + ')';
      case 'order_clear':
        return 'Table ' + payload.table;
      case 'table_checkout':
        return 'T' + payload.table + ' · ' + payload.itemCount + ' item(s) · €' + Number(payload.total).toFixed(2);
      case 'send_to_keeper':
        return 'T' + payload.table + ' · ' +
          (payload.linesSummary ? payload.linesSummary.length + ' item(s)' : '') +
          (payload.total ? ' · €' + Number(payload.total).toFixed(2) : '');
      case 'app_open':
        return (payload.deviceName || '?') + ' · ' + (payload.existingDevice ? 'returning' : 'new device');
      case 'device_created':
        return (payload.deviceId || '').slice(0, 16) + '…';
      case 'device_named':
        return '→ "' + (payload.deviceName || '') + '"';
      case 'device_rename':
        return '"' + (payload.previousName || '') + '" → "' + (payload.newName || '') + '"';
      case 'menu_item_create':
      case 'menu_item_update':
      case 'menu_item_disable':
      case 'menu_item_reactivate':
      case 'menu_item_variants_update':
        return (payload.sectionKey || '') + ': ' + (payload.itemName || '');
      case 'wine_create':
      case 'wine_update':
      case 'wine_disable':
      case 'wine_reactivate':
        return payload.wineName || '';
      case 'stoplist_change':
        return (payload.itemName || '') + ': ' + payload.before + ' → ' + payload.after;
      case 'stoplist_clear':
        return payload.beforeStoplist
          ? Object.keys(payload.beforeStoplist).length + ' item(s) cleared'
          : 'cleared';
      case 'notes_update':
        return 'Table ' + payload.table;
      case 'audit_test':
        return payload.source || 'audit.html';
      case 'MENU_SEEDED':
        return 'v' + payload.version + ' · ' + payload.categoryCount + ' cat · ' +
          payload.itemCount + ' items · ' + payload.wineCount + ' wines';
      case 'MENU_MIGRATED':
        return 'v' + payload.fromVersion + '→v' + payload.toVersion + ' · +' +
          payload.categoryCountAdded + ' cat · +' + payload.topLevelItemCountAdded + ' items · +' +
          payload.variantCountAdded + ' variants · +' + payload.wineCountAdded + ' wines';
      default:
        return JSON.stringify(payload).slice(0, 80);
    }
  } catch(e) { return ''; }
}

function escH(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toggleDetail(key) {
  const el = document.getElementById('detail-' + key);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderEvents() {
  const fd = (document.getElementById('filterDevice').value  || '').toLowerCase();
  const fa = (document.getElementById('filterAction').value  || '').toLowerCase();
  const ft = (document.getElementById('filterTable').value   || '').toLowerCase();
  const fs = (document.getElementById('filterSearch').value  || '').toLowerCase();

  let filtered = allEvents;
  if (fd) filtered = filtered.filter(e =>
    (e.deviceName || '').toLowerCase().includes(fd) || (e.deviceId || '').toLowerCase().includes(fd));
  if (fa) filtered = filtered.filter(e => (e.action || '').toLowerCase().includes(fa));
  if (ft) filtered = filtered.filter(e => String(e.table || '').toLowerCase().includes(ft));
  if (fs) filtered = filtered.filter(e => JSON.stringify(e).toLowerCase().includes(fs));

  const shown = filtered.slice(0, 200);

  if (!shown.length) {
    document.getElementById('eventList').innerHTML =
      '<div class="empty-state">No events yet · Событий пока нет</div>';
    document.getElementById('statusBar').textContent =
      'No events match filters · ' + allEvents.length + ' total';
    return;
  }

  document.getElementById('eventList').innerHTML = shown.map(e => {
    const summary  = escH(getPayloadSummary(e.action, e.payload));
    const shortId  = escH((e.deviceId || '').slice(0, 12));
    const safeKey  = escH(e._key);
    const tableTag = e.table ? `<span class="event-table">T${escH(String(e.table))}</span>` : '';
    const actionCls = 'action-' + (e.action || '').replace(/[^a-zA-Z_]/g, '');
    return `<div class="event-row" onclick="toggleDetail('${safeKey}')">
  <div class="event-main">
    <span class="event-time">${escH(formatTime(e.createdAt))}</span>
    <span class="event-device">${escH(e.deviceName || '?')}</span>
    <span class="event-id">${shortId}</span>
    <span class="event-action ${actionCls}">${escH(getActionLabel(e.action))}</span>
    ${tableTag}
    <span class="event-summary">${summary}</span>
  </div>
  <div class="event-detail" id="detail-${safeKey}" style="display:none">
    <pre>${escH(JSON.stringify(e.payload, null, 2))}</pre>
  </div>
</div>`;
  }).join('');

  document.getElementById('statusBar').textContent =
    'Showing ' + shown.length + ' of ' + filtered.length + ' filtered · ' +
    allEvents.length + ' total events';
}

function clearFilters() {
  ['filterDevice','filterAction','filterTable','filterSearch'].forEach(id => {
    document.getElementById(id).value = '';
  });
  renderEvents();
}

function writeTestEvent() {
  const btn    = document.getElementById('testWriteBtn');
  const notice = document.getElementById('testWriteNotice');
  if (btn) { btn.disabled = true; btn.textContent = 'Writing...'; }
  if (notice) notice.style.display = 'none';
  db.ref('auditLog').push({
    deviceId:   'audit_page',
    deviceName: 'Audit page',
    action:     'audit_test',
    table:      null,
    payload:    { source: 'audit.html', url: location.href },
    createdAt:  Date.now(),
  }).then(() => {
    if (btn) { btn.disabled = false; btn.textContent = '✓ Test written'; }
    setTimeout(() => { if (btn) btn.textContent = 'Write test event'; }, 3000);
  }).catch(err => {
    const code = err.code || 'UNKNOWN';
    const msg  = err.message || String(err);
    console.error('[audit.html] test write failed:', code, msg);
    if (btn) { btn.disabled = false; btn.textContent = '✗ ' + code; }
    if (notice) {
      notice.textContent = code === 'PERMISSION_DENIED'
        ? 'Firebase permission denied writing /auditLog — check database rules. ' + msg
        : 'Write error · ' + code + ': ' + msg;
      notice.style.display = 'block';
    }
  });
}

// Real-time Firebase listener — reads /auditLog, latest 500 events, shown newest first
db.ref('auditLog').orderByChild('createdAt').limitToLast(500).on('value', snapshot => {
  const data = snapshot.val() || {};
  allEvents = Object.entries(data)
    .map(([key, e]) => ({ ...e, _key: key }))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const st = document.getElementById('statusText');
  st.style.color = 'var(--nomade-muted)';
  st.textContent = allEvents.length === 0
    ? 'Connected · no events'
    : allEvents.length + ' event' + (allEvents.length !== 1 ? 's' : '') + ' · live';
  renderEvents();
}, err => {
  const code = err.code || 'UNKNOWN';
  const msg  = err.message || String(err);
  console.error('[audit.html] Firebase read error on /auditLog:', code, msg);
  const st = document.getElementById('statusText');
  st.style.color = 'var(--nomade-red)';
  st.textContent = '⚠ Firebase error · ' + code;
  document.getElementById('eventList').innerHTML =
    '<div class="error-block">' +
    '<div class="error-title">⚠ Firebase read error — path: /auditLog</div>' +
    '<div class="error-detail"><b>Code:</b> ' + escH(code) + '</div>' +
    '<div class="error-detail"><b>Message:</b> ' + escH(msg) + '</div>' +
    (code === 'PERMISSION_DENIED'
      ? '<div class="error-hint">Firebase permission denied for /auditLog — check your database security rules. ' +
        'Read access is required for this path.</div>'
      : '') +
    '</div>';
  document.getElementById('statusBar').textContent =
    'Firebase error · ' + code + ' · path: /auditLog';
});

// Filter inputs
['filterDevice','filterAction','filterTable','filterSearch'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderEvents);
});
</script>
</body>
</html>
